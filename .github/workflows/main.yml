name: build
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '17 18 * * 0'
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      HOLIDAY_KEY: ${{ secrets.HOLIDAY_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q *.zip
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v6
        with: { gradle-version: '8.13' }
      - working-directory: ShowerAlarm
        run: |
          python3 tools/holidays.py
          echo "$KEYSTORE_B64" | base64 -d > release.jks
          # 빌드 실패 시 컴파일 오류를 annotation으로 남김 (로그를 못 받는 환경에서도 원인 확인용)
          gradle assembleRelease 2>&1 | tee build.log
          test ${PIPESTATUS[0]} -eq 0 || { grep -E '^e: |What went wrong' -A2 build.log | head -30 | sed 's/^/::error::/'; exit 1; }
          cp app/build/outputs/apk/release/app-release.apk ShowerAlarm.apk
          echo "$VERSION_CODE" > version.txt
          gh release create "v$VERSION_CODE" ShowerAlarm.apk version.txt --repo "$GITHUB_REPOSITORY" --title "v$VERSION_CODE" --notes "$(git log -1 --format=%s)"
