name: build
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '17 18 * * 0'
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      HOLIDAY_KEY: ${{ secrets.HOLIDAY_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q *.zip
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v6
        with: { gradle-version: '8.13' }
      - working-directory: ShowerAlarm
        run: |
          python3 tools/holidays.py
          echo "$KEYSTORE_B64" | base64 -d > release.jks
          gradle assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ShowerAlarm.apk
          echo "$VERSION_CODE" > version.txt
          gh release create "v$VERSION_CODE" ShowerAlarm.apk version.txt --repo "$GITHUB_REPOSITORY" --title "v$VERSION_CODE" --notes "$(git log -1 --format=%s)"
